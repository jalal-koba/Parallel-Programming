services:
  db:
    image: postgres:latest
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=ecosystem
    ports:
      - "5434:5432"
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    networks:
      - app-network

  app1:
    build: .
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/ecosystem
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=pass
      - SERVER_PORT=8081
      - SPRING_BATCH_JOB_ENABLED=false
      - SPRING_DATA_REDIS_HOST=redis
    ports:
      - "8081:8081" # ربط المنفذ لتستطيع الحاوية استقبال حركة المرور
    depends_on:
      - db
      - redis
    networks:
      - app-network

  app2:
    build: .
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/ecosystem
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=pass
      - SERVER_PORT=8082
      - SPRING_BATCH_JOB_ENABLED=false
      - SPRING_DATA_REDIS_HOST=redis
    ports:
      - "8082:8082" # ربط المنفذ لتستطيع الحاوية استقبال حركة المرور

    depends_on:
      - db
      - redis
    networks:
      - app-network

  apache-lb:
    image: httpd:latest
    container_name: apache_load_balancer
    ports:
      - '9999:80'
    volumes:
      - ./httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
