spring.datasource.url=jdbc:h2:mem:ecosystem-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

logging.pattern.console=%d{HH:mm:ss} %-5level - [Instance: ${HOSTNAME:test}] - %msg%n

app.seed.enabled=false
batch.chunk.size=200
batch.progress.logging=true
batch.console.color=true

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
# Disable Redis caching in test environment
spring.cache.type=none
