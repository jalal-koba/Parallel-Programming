spring.application.name=ecosystem
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0

# Defaults for local dev. Docker overrides via SPRING_DATASOURCE_* / SERVER_PORT env vars.
spring.datasource.url=jdbc:postgresql://localhost:5432/parallel-ecommerce
spring.datasource.username=postgres
spring.datasource.password=m8498069

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.maximum-pool-size=20

logging.pattern.console=%d{HH:mm:ss} %-5level - %msg%n

app.seed.enabled=true
seed.users=5000
seed.products=1000
seed.orders=500000

batch.chunk.size=2000
batch.daily.cron=0 0 1 * * *
batch.progress.logging=true
batch.console.color=true

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
