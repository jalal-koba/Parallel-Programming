spring.application.name=ecosystem
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0

# Defaults for local dev. Docker overrides via SPRING_DATASOURCE_* / SERVER_PORT env vars.
spring.datasource.url=jdbc:postgresql://localhost:5434/parallel-ecommerce
# spring.datasource.url=jdbc:postgresql://localhost:5432/parallel-ecommerce
spring.datasource.username=postgres
spring.datasource.password=m8498069

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


logging.pattern.console=%d{HH:mm:ss} %-5level - %msg%n

app.seed.enabled=false
seed.users=50
seed.products=100
seed.orders=500

batch.chunk.size=2000
batch.daily.cron=0 0 1 * * *
batch.progress.logging=true
batch.console.color=true

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# 2 hikari 
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=20000

server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=8192

# Redis Cache
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000