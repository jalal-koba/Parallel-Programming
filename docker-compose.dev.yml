services:
  db:
    image: postgres:16
    container_name: postgres_db_docker
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: ecosystem
    ports:
      - "5434:5432"
    volumes:
      - postgres_final_data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    networks:
      - app-network

  app:
    build: .
    container_name: dev_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/ecosystem
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=pass
      - SERVER_PORT=8080
      - SPRING_BATCH_JOB_ENABLED=false
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis
    networks:
      - app-network

volumes:
  postgres_final_data:

networks:
  app-network:
    driver: bridge
