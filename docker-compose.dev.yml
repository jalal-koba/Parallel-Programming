services:
  db:
    image: postgres:16
    container_name: postgres_db_docker
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: ecosystem
    ports:
      - "5434:5432"
    volumes:
      - postgres_final_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis_cache_dev
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: ecosystem_app
    depends_on:
      - db
      - redis
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/parallel-ecommerce
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: m8498069
      SPRING_BATCH_JOB_ENABLED: false
      REDIS_HOST: redis

volumes:
  postgres_final_data:

networks:
  app-network:
    driver: bridge
